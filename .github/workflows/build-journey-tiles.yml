name: Build Journey Tiles

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Manual Trigger: Select a specific region or ALL regions'
        required: true
        default: 'europe/germany/niedersachsen'
        type: choice
        options:
          - 'ALL_REGIONS'
          - 'europe/germany/niedersachsen'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Region List
        id: regions
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.region }}" = "ALL_REGIONS" ]; then
            echo "regions=$(jq -c . .github/regions.json)" >> "$GITHUB_OUTPUT"
          else
            echo "regions=[\"${{ github.event.inputs.region }}\"]" >> "$GITHUB_OUTPUT"
          fi

  build-tiles:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.prepare.outputs.regions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Geofabrik Extract
        run: |
          wget "https://download.geofabrik.de/${{ matrix.region }}-latest.osm.pbf" \
            -O region.osm.pbf

      - name: Format Destination Filename
        run: |
          CLEAN_NAME=$(echo "${{ matrix.region }}" | tr '/' '-')
          echo "filename=$CLEAN_NAME.mbtiles" >> "$GITHUB_ENV"

      - name: Generate MBTiles via Tilemaker Docker
        continue-on-error: true
        run: |
          docker run --rm \
            -v $(pwd):/data \
            ghcr.io/systemed/tilemaker:master \
            --input /data/region.osm.pbf \
            --output "/data/${{ env.filename }}" \
            --config /data/config.json \
            --process /data/process.lua \
            --store /tmp/tilemaker_store

      - name: Upload Temporary Regional Artifact
        if: ${{ hashFiles(env.filename) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mbtiles-journey-${{ env.filename }}
          path: ${{ env.filename }}
          retention-days: 1

  deploy-tiles:
    if: ${{ always() }}
    needs: build-tiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Workspace
        run: |
          mkdir -p download_mbtiles
          mkdir -p final_tiles_extracted

      - name: Download All Generated MBTiles
        uses: actions/download-artifact@v4
        with:
          pattern: mbtiles-journey-*
          path: download_mbtiles
          merge-multiple: true

      - name: Install Tippecanoe (tile-join)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install

      - name: Merge and Extract Tiles
        run: |
          tile-join \
            --no-tile-size-limit \
            -e final_tiles_extracted \
            download_mbtiles/*.mbtiles

      - name: Deploy and Commit Consolidated Tiles to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final_tiles_extracted
          target-folder: tiles/journey
          branch: gh-pages
          clean: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'ALL_REGIONS' }}
          commit-message: "Deploy Journey Tiles 🚀"
          single-commit: false