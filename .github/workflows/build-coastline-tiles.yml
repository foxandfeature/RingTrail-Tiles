name: Build Global Coastline and Land Tiles

on:
  schedule:
    - cron: '0 0 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # - name: Free Disk Space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GDAL & Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install

      - name: Download and Unzip Shapefiles (WGS84 Versions)
        run: |
          mkdir -p data/coastlines data/land
          
          # 1. Coastlines herunterladen & entpacken
          wget "https://osmdata.openstreetmap.de/download/coastlines-split-4326.zip" -O coast.zip
          unzip -j coast.zip -d data/coastlines
          
          # 2. Land Polygons herunterladen & entpacken
          wget "https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip" -O land.zip
          unzip -j land.zip -d data/land

      - name: Convert Shapefiles to GeoJSONSeq via ogr2ogr
        run: |
          # Mit *.shp fangen wir den Dateinamen ab, da sich Ordnerstrukturen im Zip ändern können
          ogr2ogr -f GeoJSONSeq coastline.geojsonl data/coastlines/*.shp
          ogr2ogr -f GeoJSONSeq land.geojsonl data/land/*.shp

      - name: Generate Tiles via Tippecanoe (One Source, Two Layers)
        run: |
          mkdir -p final_tiles
          
          # Tippecanoe liest beide Dateien. 
          # Der Layername entspricht dem Dateinamen (also "coastline" und "land").
          tippecanoe -e final_tiles \
                     -z14 \
                     --force \
                     --no-tile-compression \
                     --drop-densest-as-needed \
                     coastline.geojsonl \
                     land.geojsonl

      - name: Deploy Tiles to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final_tiles
          target-folder: tiles/basemap
          branch: gh-pages
          clean: true
          commit-message: "Deploy Coastline & Land Tiles 🚀"
          single-commit: false