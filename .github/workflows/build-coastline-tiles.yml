name: Build Global Coastline Tiles

on:
  schedule:
    - cron: "0 0 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GDAL & Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install

      - name: Download and Unzip Coastlines Shapefile (WGS84 Version)
        run: |
          mkdir -p coastlines
          wget "https://osmdata.openstreetmap.de/download/coastlines-split-4326.zip" -O coast.zip
          unzip -j coast.zip -d coastlines

      - name: Convert Shapefile to GeoJSONSeq via ogr2ogr
        run: |
          ogr2ogr -f GeoJSONSeq coastlines.geojsonl coastlines/lines.shp

      - name: Generate Tiles via Tippecanoe
        run: |
          mkdir -p final_tiles

          tippecanoe -e final_tiles \
                     -l coastline \
                     -z14 \
                     --no-tile-compression \
                     -S 10ƒ
                     coastlines.geojsonl

      - name: Deploy Coastline Tiles to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final_tiles
          target-folder: tiles/coastline
          branch: gh-pages
          clean: true
          commit-message: "Deploy Coastline Tiles 🚀"
          single-commit: false
