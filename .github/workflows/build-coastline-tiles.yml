name: Build Global Coastline Tiles

on:
  schedule:
    - cron: '0 0 2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GDAL & Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j$(nproc) && sudo make install

      - name: Download and Process Coastlines
        run: |
          mkdir -p data/coastlines
          wget "https://osmdata.openstreetmap.de/download/coastlines-split-4326.zip" -O coast.zip
          unzip -j coast.zip -d data/coastlines && rm coast.zip
          ogr2ogr -f GeoJSONSeq coastline.geojsonl data/coastlines/*.shp
          rm -rf data/coastlines

      - name: Generate and Extract Tiles
        run: |
          tippecanoe -o tiles.mbtiles -z14 --force --no-tile-compression --drop-densest-as-needed coastline.geojsonl
          mkdir -p final_tiles
          tile-join -e final_tiles tiles.mbtiles
          rm tiles.mbtiles coastline.geojsonl

      - name: Deploy Tiles to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final_tiles
          target-folder: tiles/basemap
          branch: gh-pages
          clean: true
          commit-message: "Deploy Coastline Tiles 🚀"