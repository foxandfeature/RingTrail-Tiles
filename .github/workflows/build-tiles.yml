name: Build Custom Map Tiles

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      region:
        description: 'Manual Trigger: Select a specific region or ALL regions'
        required: true
        default: 'europe/germany/niedersachsen'
        type: choice
        options:
          - 'ALL_REGIONS'
          - 'europe/germany/niedersachsen'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      regions: ${{ steps.regions.outputs.regions }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Load Region List
        id: regions
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.region }}" = "ALL_REGIONS" ]; then
            echo "regions=$(jq -c . .github/regions.json)" >> "$GITHUB_OUTPUT"
          else
            echo "regions=[\"${{ github.event.inputs.region }}\"]" >> "$GITHUB_OUTPUT"
          fi

  build-tiles:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        region: ${{ fromJSON(needs.prepare.outputs.regions) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tilemaker
        run: |
          sudo apt-get update
          sudo apt-get install -y tilemaker

      - name: Download Geofabrik Extract
        run: |
          wget "https://download.geofabrik.de/${{ matrix.region }}-latest.osm.pbf" \
            -O region.osm.pbf

      - name: Format Destination Filename
        run: |
          CLEAN_NAME=$(echo "${{ matrix.region }}" | tr '/' '-')
          echo "filename=$CLEAN_NAME" >> "$GITHUB_ENV"

      - name: Generate PMTiles
        run: |
          tilemaker \
            --input region.osm.pbf \
            --output "${{ env.filename }}" \
            --config config.json \
            --process process.lua \
            --store /tmp/tilemaker_store

      - name: Upload Temporary Regional Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmtiles-${{ env.filename }}
          path: ${{ env.filename }}
          retention-days: 1

  deploy-tiles:
    needs: build-tiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Generated PMTiles
        uses: actions/download-artifact@v4
        with:
          path: deploy_tiles
          merge-multiple: true

      - name: Deploy and Commit Consolidated Tiles to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy_tiles
          target-folder: tiles
          branch: gh-pages
          clean: ${{ github.event_name == 'schedule' || github.event.inputs.region == 'ALL_REGIONS' }}